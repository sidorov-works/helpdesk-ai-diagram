&quot;&gt;\n          &lt;mxGeometry height=\&quot;30\&quot; width=\&quot;138\&quot; x=\&quot;102\&quot; y=\&quot;653\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;9G9WvVQiY9Bj_G9QV1fS-4\&quot; parent=\&quot;9G9WvVQiY9Bj_G9QV1fS-3\&quot; style=\&quot;ellipse;whiteSpace=wrap;html=1;shapeInside=1;aspect=fixed;strokeColor=light-dark(#000000,#CDA2BE);\&quot; value=\&quot;&amp;lt;div&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;16\&quot; width=\&quot;16\&quot; y=\&quot;7\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;9G9WvVQiY9Bj_G9QV1fS-5\&quot; parent=\&quot;9G9WvVQiY9Bj_G9QV1fS-3\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=left;verticalAlign=middle;rounded=0;fontSize=10;\&quot; value=\&quot;&amp;lt;span style=&amp;quot;text-align: center; color: light-dark(rgb(0, 0, 0), rgb(205, 162, 190));&amp;quot;&amp;gt;/generate-answer&amp;lt;/span&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;30\&quot; width=\&quot;113\&quot; x=\&quot;25\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;UserObject label=\&quot;\&quot; tooltip=\&quot;Система блокировок управляет жизненным циклом каждого тикета. Каждый тикет проходит через три основных состояния, контролируемых соответствующими блокировками: Wait Lock для аккумуляции сообщений, Process Lock на время обработки ИИ, и Escalation Lock после передачи оператору. Эта трехуровневая модель обеспечивает атомарность операций и предотвращает race conditions в распределенной системе.  Wait Lock устанавливается при получении сообщения клиента и действует в течение `WAIT_TIMEOUT` секунд. Это временное окно позволяет системе собрать &amp;quot;догоночные&amp;quot; сообщения — дополнительные уточнения, которые клиент может отправить сразу после основного вопроса. Специальный счетчик отслеживает количество продлений (до `WAIT_TTL_MAX_EXT` раз), предотвращая бесконечное ожидание. При истечении Wait Lock система извлекает сообщение из буфера и передает его ИИ-ассистенту, одновременно устанавливая Process Lock на `PROCESS_TIMEOUT` секунд — максимальное время, отведенное ИИ для генерации ответа.  Process Lock — механизм защиты от дублирования обработки. Он гарантирует, что только один экземпляр ИИ-ассистента работает с тикетом в данный момент. При успешном ответе ИИ система явно снимает Process Lock, предотвращая ложное срабатывание тайм-аута. Если же ответ не получен в течение `PROCESS_TIMEOUT`, система мониторинга обнаруживает истечение Process Lock и автоматически эскалирует тикет оператору, одновременно устанавливая Escalation Lock на `ESCALATION_TIMEOUT` секунд.  Escalation Lock маркирует тикеты, переданные операторам. При его установке атомарная операция удаляет все другие блокировки и буфер сообщений для этого тикета. Любые последующие сообщения клиента в эскалированном тикете игнорируются — система проверяет Escalation Lock до буферизации, предотвращая ненужную обработку.&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;Ответ оператора полностью очищает состояние через атомарную операцию, которая удаляет все четыре ключа (wait, process, escalation, buffer), возвращая тикет в исходное состояние для возможного последующего взаимодействия.  Отдельно существует системная блокировка Cooldown — механизм самозащиты при перегрузке. Она активируется при частых тайм-аутах Process Lock или переполнении очередей, и экспоненциально увеличивает свой TTL при повторных срабатываниях (до `COOLDOWN_MAX_TTL`). В режиме Cooldown все новые тикеты немедленно эскалируются операторам, давая системе &amp;quot;передышку&amp;quot; для восстановления.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;При недоступности хранилища блокировок применяем graceful degradation: все операции немедленно завершаются эскалацией, обеспечивая хотя бы минимальный уровень сервиса при любых обстоятельствах.&amp;lt;/div&amp;gt;\&quot; id=\&quot;9G9WvVQiY9Bj_G9QV1fS-23\&quot;&gt;\n          &lt;mxCell connectable=\&quot;0\&quot; parent=\&quot;ZyrPwLk0e6lqTQtchfoi-1\&quot; style=\&quot;group;fontSize=12;\&quot; vertex=\&quot;1\&quot;&gt;\n            &lt;mxGeometry height=\&quot;138.16\&quot; width=\&quot;161\&quot; x=\&quot;145\&quot; y=\&quot;494\&quot; as=\&quot;geometry\&quot; /&gt;\n          &lt;/mxCell&gt;\n        &lt;/UserObject&gt;\n        &lt;mxCell id=\&quot;9G9WvVQiY9Bj_G9QV1fS-20\&quot; parent=\&quot;9G9WvVQiY9Bj_G9QV1fS-23\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;verticalAlign=top;fontSize=10;strokeColor=light-dark(#000000,#CCCCCC);\&quot; value=\&quot;&amp;lt;a href=&amp;quot;https://github.com/sidorov-works/helpdesk_gate/blob/main/shared/lock_service.py&amp;quot;&amp;gt;Управление&amp;lt;/a&amp;gt; блокировками&amp;lt;br&amp;gt;и буферизация сообщений\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;118\&quot; width=\&quot;161\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;ZyrPwLk0e6lqTQtchfoi-28\&quot; parent=\&quot;9G9WvVQiY9Bj_G9QV1fS-23\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=6.79998779296875;rotation=90;horizontal=0;labelBackgroundColor=none;strokeColor=light-dark(#000000,#CCCCCC);fontSize=11;\&quot; value=\&quot;&amp;lt;a href=&amp;quot;https://github.com/sidorov-works/redis-for-helpdesk/blob/main/docker-compose.redis-gate.yml&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px;&amp;quot;&amp;gt;Блокировки,&amp;lt;br&amp;gt;буфер сообщений&amp;lt;/font&amp;gt;&amp;lt;/a&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;111.19\&quot; width=\&quot;50.5\&quot; x=\&quot;57.34\&quot; y=\&quot;20.97\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;m
